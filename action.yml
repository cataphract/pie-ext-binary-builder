name: 'PIE Pre-Packaged Binary Action'
description: 'Build and upload a PIE pre-packaged binary with the expected naming conventions.'
inputs:
  configure-flags:
    description: 'Flags to pass to ./configure'
    required: false
    default: ''
  build-path:
    description: 'Path to the extension source directory containing config.m4 (relative to repo root)'
    required: false
    default: '.'
  release-tag:
    description: 'The tag to use for the release. If omitted, zip and upload steps are skipped.'
    required: false
    default: ''
  github-token:
    description: 'The GitHub token to use for uploading assets'
    required: false
    default: ''
  skip-build:
    description: 'If true, skip phpize/configure/make and only run patchelf (when libc-target is anylibc) and upload.'
    required: false
    default: 'false'
  libc-target:
    description: >
      Target libc for the build. "host" (default) uses whatever libc is on the
      runner. On Linux, "anylibc" can also be specified to indicate that the
      resulting binary is compatible with both glibc and musl.
    required: false
    default: 'host'
outputs:
  package-path:
    description: 'Path to the generated .zip package'
runs:
  using: 'node20'
  main: dist/index.js
