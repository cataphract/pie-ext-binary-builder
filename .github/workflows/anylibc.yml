name: C/C++ extension anylibc tests

on:
  push:
  pull_request:

env:
  RELEASE_TAG: 0.0.0-fake+run_${{ github.run_id }}

jobs:

  create-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: 'true'
          ref: ${{ github.ref }}

      - name: Create a fake tag for the build
        run: |
          git config --global user.email "Fake User"
          git config --global user.name "fake-user@example.com"
          git tag -a -m "test tag for CI build ${{ github.run_id }}" ${{ env.RELEASE_TAG }}
          git push origin ${{ env.RELEASE_TAG }}

      - name: Create a fake release for the build
        run: gh release create "${{ env.RELEASE_TAG }}" --title "${{ env.RELEASE_TAG }}" --draft --notes-from-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-extension:
    name: ${{ matrix.ext-name }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    needs: [create-test-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            debug: 'false'
            phpts: nts
            test-runner: run-tests-rar.php

          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            debug: 'false'
            phpts: ts
            test-runner: run-tests-rar.php

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            debug: 'false'
            phpts: nts

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            variant: 8.0-release-ondrej
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: ubuntu:22.04
            glibc-apt-packages: software-properties-common ca-certificates
            glibc-pre-test-cmd: add-apt-repository ppa:ondrej/php && apt-get update -q && apt-get install -y -q php8.0-cli
            no-upload: 'true'
            debug: 'false'
            phpts: nts

          # apcu mixes php pcre apis with pure pcre2 apis
          # Test with a glibc image that has PHP compiled WITHOUT bundled pcr
          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            debug: 'false'
            phpts: ts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            container-packages: ''
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            debug: 'false'
            phpts: nts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            container-packages: ''
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            debug: 'false'
            phpts: ts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            container-packages: imagemagick-dev ghostscript ghostscript-fonts
            container-pre-build-script: .github/workflows/scripts/imagick-force-static.sh
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            glibc-apt-packages: ghostscript gsfonts imagemagick-6-common
            glibc-pre-test-cmd: ln -sf /etc/ImageMagick-6 /etc/ImageMagick-7
            debug: 'false'
            phpts: nts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            container-packages: imagemagick-dev ghostscript ghostscript-fonts
            container-pre-build-script: .github/workflows/scripts/imagick-force-static.sh
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            glibc-apt-packages: ghostscript gsfonts imagemagick-6-common
            glibc-pre-test-cmd: ln -sf /etc/ImageMagick-6 /etc/ImageMagick-7
            debug: 'false'
            phpts: ts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            container-packages: ''
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            debug: 'false'
            phpts: nts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            container-packages: ''
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            debug: 'false'
            phpts: ts

          - ext-name: memcached
            repository: php-memcached-dev/php-memcached
            ref: v3.4.0
            container-packages: memcached
            container-pre-build-script: ".github/workflows/scripts/memcached-static.sh"
            configure-flags: --enable-memcached-sasl --enable-memcached-igbinary
            # -L/usr/local/static-link must precede the default lib paths so the
            # linker finds the .a-only copies of libz and libsasl2 first (no .so
            # present there), giving static linkage without removing system shared
            # libs (needed by git/toolchain during the pre-build script).
            ldflags: '-L/usr/local/static-link'
            # igbinary.so is built by memcached-static.sh and placed in ext/modules/.
            # It must be loaded before memcached.so to satisfy ZEND_MOD_REQUIRED.
            extra-extension: modules/igbinary.so
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            glibc-apt-packages: memcached
            glibc-pre-test-cmd: memcached -d -u nobody && sleep 0.3
            musl-pre-test-cmd: memcached -d -u nobody && sleep 0.3
            test-dir: tests/*.phpt
            debug: 'false'
            phpts: nts

          - ext-name: memcached
            repository: php-memcached-dev/php-memcached
            ref: v3.4.0
            container-packages: memcached
            container-pre-build-script: ".github/workflows/scripts/memcached-static.sh"
            configure-flags: --enable-memcached-sasl --enable-memcached-igbinary
            ldflags: '-L/usr/local/static-link'
            extra-extension: modules/igbinary.so
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            glibc-apt-packages: memcached
            glibc-pre-test-cmd: memcached -d -u nobody && sleep 0.3
            musl-pre-test-cmd: memcached -d -u nobody && sleep 0.3
            test-dir: tests/*.phpt
            debug: 'false'
            phpts: ts

          - ext-name: swoole
            repository: swoole/swoole-src
            ref: v6.2.2
            # Prepare static OpenSSL/Brotli libraries and the ext-sockets header.
            container-pre-build-script: .github/workflows/scripts/swoole-static.sh
            configure-flags: --enable-brotli --enable-sockets
            ldflags: '-L/usr/local/static-link'
            variant: 8.2-release
            image: ghcr.io/cataphract/php-minimal:8.2-release
            musl-test-image: php:8.2-cli-alpine
            glibc-image: php:8.2-cli-bullseye
            # Install Composer dependencies used by Swoole's PHPT support library.
            test-prepare-script: .github/workflows/scripts/swoole-test-prepare.sh
            # Build sockets and pcntl in the test image, then enable Swoole.
            test-runtime-setup-script: .github/workflows/scripts/swoole-test-runtime.sh
            # Start the remote object server required by the selected PHPTs.
            test-init-script: .github/workflows/scripts/swoole-test-init.php
            test-extension-mode: ini
            test-runner: tests/run-tests
            test-runner-php-args: -d memory_limit=-1
            test-php-args: -d memory_limit=1024M
            test-args: --offline --set-timeout 30
            test-list: .github/workflows/test-lists/swoole-6.2.2.txt
            test-phpt: '1'
            test-home: /tmp/swoole-test-home

    steps:
      - name: Install tools
        run: apk add --no-cache gcompat git zip docker-cli patchelf

      - name: Install Alpine packages
        if: matrix.container-packages != ''
        run: apk add --no-cache ${{ matrix.container-packages }}

      - name: Checkout pie-ext-binary-builder (the action)
        uses: actions/checkout@v6

      - name: Checkout ${{ matrix.ext-name }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: ext

      - name: Run container pre-build script
        if: matrix.container-pre-build-script != ''
        run: sh ${{ matrix.container-pre-build-script }}

      - name: Build extension via action (includes patchelf)
        uses: ./
        env:
          LDFLAGS: ${{ matrix.ldflags || '' }}
        with:
          release-tag: ${{ matrix.no-upload != 'true' && env.RELEASE_TAG || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-path: ext
          libc-target: anylibc
          configure-flags: ${{ matrix.configure-flags || '' }}

      - name: Prepare test fixtures
        if: matrix.test-prepare-script != ''
        run: sh "${{ matrix.test-prepare-script }}"

      - name: Test in musl
        env:
          TEST_IMAGE: ${{ matrix.musl-test-image || matrix.image }}
          TEST_PACKAGES: ${{ matrix.musl-test-packages || matrix.container-packages }}
          TEST_PRE_COMMAND: ${{ matrix.musl-pre-test-cmd }}
          TEST_EXTENSION_NAME: ${{ matrix.ext-name }}
          TEST_EXTRA_EXTENSION: ${{ matrix.extra-extension }}
          TEST_ZEND_EXTENSION: ${{ matrix.zend_extension }}
          TEST_EXTENSION_MODE: ${{ matrix.test-extension-mode || 'argument' }}
          TEST_RUNTIME_SETUP_SCRIPT: ${{ matrix.test-runtime-setup-script }}
          TEST_INIT_SCRIPT: ${{ matrix.test-init-script }}
          TEST_RUNNER: ${{ matrix.test-runner || 'run-tests.php' }}
          TEST_RUNNER_PHP_ARGS: ${{ matrix.test-runner-php-args }}
          TEST_PHP_ARGS: ${{ matrix.test-php-args }}
          TEST_ARGS: ${{ matrix.test-args }}
          TEST_PATH: ${{ matrix.test-dir || 'tests/' }}
          TEST_LIST: ${{ matrix.test-list }}
          TEST_PHPT: ${{ matrix.test-phpt }}
          TEST_HOME: ${{ matrix.test-home }}
        run: sh .github/workflows/scripts/run-extension-tests.sh musl

      - name: Test on glibc
        env:
          TEST_IMAGE: ${{ matrix.glibc-image }}
          TEST_PACKAGES: ${{ matrix.glibc-apt-packages }}
          TEST_PRE_COMMAND: ${{ matrix.glibc-pre-test-cmd }}
          TEST_EXTENSION_NAME: ${{ matrix.ext-name }}
          TEST_EXTRA_EXTENSION: ${{ matrix.extra-extension }}
          TEST_ZEND_EXTENSION: ${{ matrix.zend_extension }}
          TEST_EXTENSION_MODE: ${{ matrix.test-extension-mode || 'argument' }}
          TEST_RUNTIME_SETUP_SCRIPT: ${{ matrix.test-runtime-setup-script }}
          TEST_INIT_SCRIPT: ${{ matrix.test-init-script }}
          TEST_RUNNER: ${{ matrix.test-runner || 'run-tests.php' }}
          TEST_RUNNER_PHP_ARGS: ${{ matrix.test-runner-php-args }}
          TEST_PHP_ARGS: ${{ matrix.test-php-args }}
          TEST_ARGS: ${{ matrix.test-args }}
          TEST_PATH: ${{ matrix.test-dir || 'tests/' }}
          TEST_LIST: ${{ matrix.test-list }}
          TEST_PHPT: ${{ matrix.test-phpt }}
          TEST_HOME: ${{ matrix.test-home }}
        run: sh .github/workflows/scripts/run-extension-tests.sh glibc

  delete-test-release:
    runs-on: ubuntu-latest
    needs: [test-extension]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Delete test release
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" > /dev/null 2>&1; then
            gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag
          else
            echo "Release ${{ env.RELEASE_TAG }} does not exist, skipping deletion."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
