name: C/C++ extension anylibc tests

on:
  push:
  pull_request:

env:
  RELEASE_TAG: 0.0.0-fake+run_${{ github.run_id }}

jobs:

  create-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: 'true'
          ref: ${{ github.ref }}

      - name: Create a fake tag for the build
        run: |
          git config --global user.email "Fake User"
          git config --global user.name "fake-user@example.com"
          git tag -a -m "test tag for CI build ${{ github.run_id }}" ${{ env.RELEASE_TAG }}
          git push origin ${{ env.RELEASE_TAG }}

      - name: Create a fake release for the build
        run: gh release create "${{ env.RELEASE_TAG }}" --title "${{ env.RELEASE_TAG }}" --draft --notes-from-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test-musl:
    name: ${{ matrix.ext-name }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    needs: [create-test-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts
            test-runner: run-tests-rar.php

          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts
            test-runner: run-tests-rar.php

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            container-packages: imagemagick-dev ghostscript ghostscript-fonts
            host-apt-packages: ghostscript gsfonts
            host-pre-test-script: sudo ln -s /etc/ImageMagick-6/ /etc/ImageMagick-7
            container-pre-build-script: .github/workflows/scripts/imagick-force-static.sh
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            container-packages: imagemagick-dev ghostscript ghostscript-fonts
            host-apt-packages: ghostscript gsfonts
            host-pre-test-script: sudo ln -s /etc/ImageMagick-6/ /etc/ImageMagick-7
            container-pre-build-script: .github/workflows/scripts/imagick-force-static.sh
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts

    steps:
      - name: Install gcompat and git for GitHub Actions runner
        run: apk add --no-cache gcompat git

      - name: Install Alpine packages
        if: matrix.container-packages != ''
        run: apk add --no-cache ${{ matrix.container-packages }}

      - name: Checkout pie-ext-binary-builder (the action)
        uses: actions/checkout@v6

      - name: Checkout ${{ matrix.ext-name }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: ext

      - name: Run container pre-build script
        if: matrix.container-pre-build-script != ''
        run: sh ${{ matrix.container-pre-build-script }}

      - name: Build extension via action
        uses: ./
        with:
          release-tag: ${{ env.RELEASE_TAG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-path: ext
          libc-target: anylibc

      - name: Upload .so artifact for glibc test
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ext-name }}-${{ matrix.variant }}-so
          path: ext/modules/${{ matrix.ext-name }}.so

      - name: Test in musl container
        working-directory: ext
        run: |
          php ${{ matrix.test-runner || 'run-tests.php' }} \
            -n -d ${{ matrix.zend_extension == 'true' && 'zend_extension' || 'extension' }}=$(realpath modules/${{ matrix.ext-name }}.so) \
            --show-diff -q tests/

  test-glibc:
    name: ${{ matrix.ext-name }} / ${{ matrix.variant }} (glibc)
    runs-on: ubuntu-latest
    needs: [build-and-test-musl]
    strategy:
      fail-fast: false
      matrix:
        include:
          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            debug: 'false'
            phpts: nts
            test-runner: run-tests-rar.php

          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            debug: 'false'
            phpts: ts
            test-runner: run-tests-rar.php

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            debug: 'false'
            phpts: nts

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            debug: 'false'
            phpts: ts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            debug: 'false'
            phpts: nts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            debug: 'false'
            phpts: ts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            host-apt-packages: ghostscript gsfonts
            host-pre-test-script: sudo ln -s /etc/ImageMagick-6/ /etc/ImageMagick-7
            variant: 8.0-release
            php-version: '8.0'
            debug: 'false'
            phpts: nts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            host-apt-packages: ghostscript gsfonts
            host-pre-test-script: sudo ln -s /etc/ImageMagick-6/ /etc/ImageMagick-7
            variant: 8.5-release-zts
            php-version: '8.5'
            debug: 'false'
            phpts: ts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            debug: 'false'
            phpts: nts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            debug: 'false'
            phpts: ts

    steps:
      - name: Checkout ${{ matrix.ext-name }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: ext

      - name: Download .so artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.ext-name }}-${{ matrix.variant }}-so
          path: ext/modules/

      - name: Install host APT packages
        if: matrix.host-apt-packages != ''
        run: sudo apt-get install -y ${{ matrix.host-apt-packages }}

      - name: Setup PHP ${{ matrix.php-version }} on host (glibc)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: none
        env:
          debug: ${{ matrix.debug }}
          phpts: ${{ matrix.phpts }}

      - name: Run pre-test host script
        if: matrix.host-pre-test-script != ''
        run: ${{ matrix.host-pre-test-script }}

      - name: Test on glibc
        working-directory: ext
        run: |
          php ${{ matrix.test-runner || 'run-tests.php' }} -n -q --show-diff \
            -d "${{ matrix.zend_extension == 'true' && 'zend_extension' || 'extension' }}=$(realpath modules/${{ matrix.ext-name }}.so)" -n tests

  delete-test-release:
    runs-on: ubuntu-latest
    needs: [test-glibc]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Delete test release
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" > /dev/null 2>&1; then
            gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag
          else
            echo "Release ${{ env.RELEASE_TAG }} does not exist, skipping deletion."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
