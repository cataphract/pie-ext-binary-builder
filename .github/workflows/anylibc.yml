name: C/C++ extension anylibc tests

on:
  push:
  pull_request:

env:
  RELEASE_TAG: 0.0.0-fake+run_${{ github.run_id }}

jobs:

  create-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: 'true'
          ref: ${{ github.ref }}

      - name: Create a fake tag for the build
        run: |
          git config --global user.email "Fake User"
          git config --global user.name "fake-user@example.com"
          git tag -a -m "test tag for CI build ${{ github.run_id }}" ${{ env.RELEASE_TAG }}
          git push origin ${{ env.RELEASE_TAG }}

      - name: Create a fake release for the build
        run: gh release create "${{ env.RELEASE_TAG }}" --title "${{ env.RELEASE_TAG }}" --draft --notes-from-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-extension:
    name: ${{ matrix.ext-name }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    needs: [create-test-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            debug: 'false'
            phpts: nts
            test-runner: run-tests-rar.php

          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            debug: 'false'
            phpts: ts
            test-runner: run-tests-rar.php

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            container-pre-build-script: ".github/workflows/scripts/force-static-pcre2.sh"
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            debug: 'false'
            phpts: nts

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            container-pre-build-script: ".github/workflows/scripts/force-static-pcre2.sh"
            variant: 8.0-release-ondrej
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: ubuntu:22.04
            glibc-apt-packages: software-properties-common ca-certificates
            glibc-pre-test-cmd: add-apt-repository ppa:ondrej/php && apt-get update -q && apt-get install -y -q php8.0-cli
            no-upload: 'true'
            debug: 'false'
            phpts: nts

          # apcu mixes php pcre apis with pure pcre2 apis
          # Test with a glibc image that has PHP compiled WITHOUT bundled pcr
          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            container-pre-build-script: ".github/workflows/scripts/force-static-pcre2.sh"
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            debug: 'false'
            phpts: ts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            container-packages: ''
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            debug: 'false'
            phpts: nts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            container-packages: ''
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            debug: 'false'
            phpts: ts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            container-packages: imagemagick-dev ghostscript ghostscript-fonts
            container-pre-build-script: .github/workflows/scripts/imagick-force-static.sh
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            glibc-apt-packages: ghostscript gsfonts imagemagick-6-common
            glibc-pre-test-cmd: ln -sf /etc/ImageMagick-6 /etc/ImageMagick-7
            # Font-dependent tests fail on glibc: IM7 built without fontconfig in
            # Alpine so it reads type-ghostscript.xml, but Debian's font paths
            # differ from Alpine's. Core functionality (load + non-font ops) passes.
            allow-test-failures: 'true'
            debug: 'false'
            phpts: nts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            container-packages: imagemagick-dev ghostscript ghostscript-fonts
            container-pre-build-script: .github/workflows/scripts/imagick-force-static.sh
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            glibc-apt-packages: ghostscript gsfonts imagemagick-6-common
            glibc-pre-test-cmd: ln -sf /etc/ImageMagick-6 /etc/ImageMagick-7
            allow-test-failures: 'true'
            debug: 'false'
            phpts: ts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            container-packages: ''
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            debug: 'false'
            phpts: nts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            container-packages: ''
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            debug: 'false'
            phpts: ts

          - ext-name: memcached
            repository: php-memcached-dev/php-memcached
            ref: v3.4.0
            container-packages: memcached
            container-pre-build-script: ".github/workflows/scripts/memcached-static.sh"
            configure-flags: --disable-memcached-sasl --disable-memcached-protocol
            variant: 8.0-release
            image: ghcr.io/cataphract/php-minimal:8.0-release
            glibc-image: php:8.0-cli
            glibc-apt-packages: memcached
            glibc-pre-test-cmd: memcached -d -u nobody && sleep 0.3
            musl-pre-test-cmd: memcached -d -u nobody && sleep 0.3
            test-dir: tests/*.phpt
            # *_badunserialize tests fail on PHP 8.0 due to Serializable API
            # changes; also fails with a standard glibc build, not our fault.
            allow-test-failures: 'true'
            debug: 'false'
            phpts: nts

          - ext-name: memcached
            repository: php-memcached-dev/php-memcached
            ref: v3.4.0
            container-packages: memcached
            container-pre-build-script: ".github/workflows/scripts/memcached-static.sh"
            configure-flags: --disable-memcached-sasl --disable-memcached-protocol
            variant: 8.5-release-zts
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            glibc-image: php:8.5-zts
            glibc-apt-packages: memcached
            glibc-pre-test-cmd: memcached -d -u nobody && sleep 0.3
            musl-pre-test-cmd: memcached -d -u nobody && sleep 0.3
            test-dir: tests/*.phpt
            # *_badunserialize tests fail on PHP 8.5 too; also fails with a
            # standard glibc build, not our fault.
            allow-test-failures: 'true'
            debug: 'false'
            phpts: ts

    steps:
      - name: Install tools
        run: apk add --no-cache gcompat git zip docker-cli patchelf

      - name: Install Alpine packages
        if: matrix.container-packages != ''
        run: apk add --no-cache ${{ matrix.container-packages }}

      - name: Checkout pie-ext-binary-builder (the action)
        uses: actions/checkout@v6

      - name: Checkout ${{ matrix.ext-name }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: ext

      - name: Run container pre-build script
        if: matrix.container-pre-build-script != ''
        run: sh ${{ matrix.container-pre-build-script }}

      - name: Build extension via action (includes patchelf)
        uses: ./
        env:
          LDFLAGS: ${{ matrix.ldflags || '' }}
        with:
          release-tag: ${{ matrix.no-upload != 'true' && env.RELEASE_TAG || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-path: ext
          libc-target: anylibc
          configure-flags: ${{ matrix.configure-flags || '' }}

      - name: Test in musl
        continue-on-error: ${{ matrix.allow-test-failures == 'true' }}
        working-directory: ext
        run: |
          if [ -n "${{ matrix.musl-pre-test-cmd }}" ]; then eval "${{ matrix.musl-pre-test-cmd }}"; fi
          php ${{ matrix.test-runner || 'run-tests.php' }} \
            -n -d ${{ matrix.zend_extension == 'true' && 'zend_extension' || 'extension' }}=$(realpath modules/${{ matrix.ext-name }}.so) \
            --show-diff -q ${{ matrix.test-dir || 'tests/' }}

      - name: Test on glibc
        continue-on-error: ${{ matrix.allow-test-failures == 'true' }}
        run: |
          APT_PKGS="${{ matrix.glibc-apt-packages }}"
          PRE_CMD="${{ matrix.glibc-pre-test-cmd }}"
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "${{ github.workspace }}/ext:/ext" \
            -w /ext \
            "${{ matrix.glibc-image }}" \
            sh -c "${APT_PKGS:+apt update && apt-get install -y ${APT_PKGS} && }${PRE_CMD:+${PRE_CMD} && }php ${{ matrix.test-runner || 'run-tests.php' }} \
              -n -d ${{ matrix.zend_extension == 'true' && 'zend_extension' || 'extension' }}=/ext/modules/${{ matrix.ext-name }}.so \
              --show-diff -q ${{ matrix.test-dir || 'tests/' }}"

  delete-test-release:
    runs-on: ubuntu-latest
    needs: [test-extension]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Delete test release
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" > /dev/null 2>&1; then
            gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag
          else
            echo "Release ${{ env.RELEASE_TAG }} does not exist, skipping deletion."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
