name: C/C++ extension anylibc tests

on:
  push:
  pull_request:

env:
  RELEASE_TAG: 0.0.0-fake+run_${{ github.run_id }}

jobs:

  create-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: 'true'
          ref: ${{ github.ref }}

      - name: Create a fake tag for the build
        run: |
          git config --global user.email "Fake User"
          git config --global user.name "fake-user@example.com"
          git tag -a -m "test tag for CI build ${{ github.run_id }}" ${{ env.RELEASE_TAG }}
          git push origin ${{ env.RELEASE_TAG }}

      - name: Create a fake release for the build
        run: gh release create "${{ env.RELEASE_TAG }}" --title "${{ env.RELEASE_TAG }}" --draft --notes-from-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-extension:
    name: ${{ matrix.ext-name }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: [create-test-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ext-name: simdjson
            repository: JakubOnderka/simdjson-php
            ref: v2.1.0
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-debug
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-debug
            debug: 'true'
            phpts: nts

          - ext-name: simdjson
            repository: JakubOnderka/simdjson-php
            ref: v2.1.0
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release-zts
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-zts
            debug: 'false'
            phpts: ts

          - ext-name: lz4
            repository: kjdev/php-ext-lz4
            ref: 0.4.3
            container-packages: lz4-dev
            host-apt-packages: liblz4-1
            variant: 8.0-debug
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-debug
            debug: 'true'
            phpts: nts

          - ext-name: lz4
            repository: kjdev/php-ext-lz4
            ref: 0.4.3
            container-packages: lz4-dev
            host-apt-packages: liblz4-1
            variant: 8.0-release-zts
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-zts
            debug: 'false'
            phpts: ts

          - ext-name: blake3
            repository: cypherbits/php-blake3
            ref: v1.0
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-debug
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-debug
            debug: 'true'
            phpts: nts

          - ext-name: blake3
            repository: cypherbits/php-blake3
            ref: v1.0
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release-zts
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-zts
            debug: 'false'
            phpts: ts

          # ── duckdb (C wrapper over DuckDB C API; needs cmake + g++ in container) ─
          - ext-name: duckdb
            repository: satur-io/duckdb-ext
            ref: v0.1.12
            container-packages: cmake g++
            host-apt-packages: ''
            variant: 8.0-debug
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-debug
            debug: 'true'
            phpts: nts

          - ext-name: duckdb
            repository: satur-io/duckdb-ext
            ref: v0.1.12
            container-packages: cmake g++
            host-apt-packages: ''
            variant: 8.0-release-zts
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-zts
            debug: 'false'
            phpts: ts

          # ── php-rar (no external deps) ────────────────────────────────────────
          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-debug
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-debug
            debug: 'true'
            phpts: nts

          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release-zts
            php-version: '8.0'
            image: cataphract/php-minimal:8.0-zts
            debug: 'false'
            phpts: ts

    steps:
      - name: Checkout pie-ext-binary-builder (the action)
        uses: actions/checkout@v6

      - name: Checkout ${{ matrix.ext-name }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: ext

      - name: Install host APT packages
        if: matrix.host-apt-packages != ''
        run: sudo apt-get install -y ${{ matrix.host-apt-packages }}

      - name: Setup PHP ${{ matrix.php-version }} on host (glibc)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: none
        env:
          debug: ${{ matrix.debug }}
          phpts: ${{ matrix.phpts }}

      - name: Build extension via action
        uses: ./
        with:
          release-tag: ${{ env.RELEASE_TAG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-path: ext
          libc-target: anylibc
          docker-image: ${{ matrix.image }}
          container-packages: ${{ matrix.container-packages }}

      - name: Run make test inside musl container
        run: |
          PKGS="${{ matrix.container-packages }}"
          INSTALL="${PKGS:+apk add --no-cache ${PKGS} && }"
          docker run --rm \
            -v "${{ github.workspace }}/ext:/ext" \
            -w /ext \
            "${{ matrix.image }}" \
            sh -c "${INSTALL}make test NO_INTERACTION=1 REPORT_EXIT_STATUS=1"

      - name: Fetch run-tests.php
        run: |
          curl -sLf \
            "https://raw.githubusercontent.com/php/php-src/PHP-${{ matrix.php-version }}/run-tests.php" \
            -o /tmp/run-tests.php

      - name: Test outside container (glibc)
        run: |
          EXT_SO="$(find "${{ github.workspace }}/ext/modules" -name '*.so' -print -quit)"
          [ -n "$EXT_SO" ] || (echo "No .so found in ext/modules/"; exit 1)
          if [ -d "${{ github.workspace }}/ext/tests" ]; then
            php /tmp/run-tests.php -p "$(which php)" -q \
              -d "extension=${EXT_SO}" \
              "${{ github.workspace }}/ext/tests/"
          else
            php -d "extension=${EXT_SO}" \
              -r "extension_loaded('${{ matrix.ext-name }}') || exit(1);"
          fi

  delete-test-release:
    runs-on: ubuntu-latest
    needs: [test-extension]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Delete test release
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" > /dev/null 2>&1; then
            gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag
          else
            echo "Release ${{ env.RELEASE_TAG }} does not exist, skipping deletion."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
