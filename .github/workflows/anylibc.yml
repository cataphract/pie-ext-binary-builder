name: C/C++ extension anylibc tests

on:
  push:
  pull_request:

jobs:

  test-extension:
    name: ${{ matrix.ext-name }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts
            test-runner: run-tests-rar.php

          - ext-name: rar
            repository: cataphract/php-rar
            ref: v4.3.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts
            test-runner: run-tests-rar.php

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts

          - ext-name: apcu
            repository: krakjoe/apcu
            ref: v5.1.28
            container-packages: ''
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts

          - ext-name: inotify
            repository: arnaud-lb/php-inotify
            ref: 3.0.1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            container-packages: imagemagick-dev ghostscript ghostscript-fonts
            host-apt-packages: ghostscript gsfonts
            host-pre-test-script: sudo ln -s /etc/ImageMagick-6/ /etc/ImageMagick-7
            container-pre-build-script: .github/workflows/scripts/imagick-force-static.sh
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts

          - ext-name: imagick
            repository: Imagick/imagick
            ref: 3.8.1
            container-packages: imagemagick-dev ghostscript ghostscript-fonts
            host-apt-packages: ghostscript gsfonts
            host-pre-test-script: sudo ln -s /etc/ImageMagick-6/ /etc/ImageMagick-7
            container-pre-build-script: .github/workflows/scripts/imagick-force-static.sh
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.0-release
            php-version: '8.0'
            image: ghcr.io/cataphract/php-minimal:8.0-release
            debug: 'false'
            phpts: nts

          - ext-name: igbinary
            repository: igbinary/igbinary
            ref: 3.2.17RC1
            container-packages: ''
            host-apt-packages: ''
            variant: 8.5-release-zts
            php-version: '8.5'
            image: ghcr.io/cataphract/php-minimal:8.5-release-zts
            debug: 'false'
            phpts: ts

    steps:
      - name: Checkout pie-ext-binary-builder (the action)
        uses: actions/checkout@v6

      - name: Checkout ${{ matrix.ext-name }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: ext

      - name: Install host APT packages
        if: matrix.host-apt-packages != ''
        run: sudo apt-get install -y ${{ matrix.host-apt-packages }}

      - name: Setup PHP ${{ matrix.php-version }} on host (glibc)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: none
        env:
          debug: ${{ matrix.debug }}
          phpts: ${{ matrix.phpts }}

      - name: Install patchelf
        run: sudo apt-get install -y patchelf

      - name: Build extension in musl container
        run: |
          PRE_BUILD=""
          if [ -n "${{ matrix.container-pre-build-script }}" ]; then
            PRE_BUILD="sh /workspace/${{ matrix.container-pre-build-script }} && "
          fi
          PKGS="${{ matrix.container-packages }}"
          INSTALL="${PKGS:+apk add --no-cache ${PKGS} && }"
          docker run --rm \
            -e GITHUB_WORKSPACE=/workspace \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/ext \
            "${{ matrix.image }}" \
            sh -c "${INSTALL}${PRE_BUILD}phpize && ./configure && make"

      - name: Fix .so ownership (built as root inside docker)
        run: sudo chown "$USER" "${{ github.workspace }}/ext/modules/${{ matrix.ext-name }}.so"

      - name: Strip libc dependency from .so
        uses: ./
        with:
          build-path: ext
          libc-target: anylibc
          skip-build: 'true'

      - name: Test in musl container
        run: |
          PKGS="${{ matrix.container-packages }}"
          INSTALL="${PKGS:+apk add --no-cache ${PKGS} && }"
          docker run --rm \
            -v "${{ github.workspace }}/ext:/ext" \
            -w /ext \
            "${{ matrix.image }}" \
            sh -c "${INSTALL}php ${{ matrix.test-runner || 'run-tests.php' }} \
              -n -d ${{ matrix.zend_extension == 'true' && 'zend_extension' || 'extension' }}=/ext/modules/${{ matrix.ext-name }}.so \
              --show-diff -q tests/"

      - name: Run pre-test host script
        if: matrix.host-pre-test-script != ''
        run: ${{ matrix.host-pre-test-script }}

      - name: Test on glibc (host)
        working-directory: ext
        run: |
          php ${{ matrix.test-runner || 'run-tests.php' }} -n -q --show-diff \
            -d "${{ matrix.zend_extension == 'true' && 'zend_extension' || 'extension' }}=$(realpath modules/${{ matrix.ext-name }}.so)" -n tests
